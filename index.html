<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0614">
<meta name="description" content="KAZOO SIMULATOR: Operación Sin César. Plataformas 8-bit +18 de Kazoo Studios.">
<title>KAZOO SIMULATOR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>

<div id="touch">
  <div class="pad-l">
    <button data-a="up" class="dp up">▲</button>
    <button data-a="left" class="dp left">◀</button>
    <button data-a="right" class="dp right">▶</button>
    <button data-a="down" class="dp down">▼</button>
  </div>
  <div class="pad-r">
    <button data-a="kazoo" class="kz">🎺</button>
    <button data-a="run" class="bb">B</button>
    <button data-a="jump" class="ab">A</button>
  </div>
  <button data-a="pause" class="pause">II</button>
</div>

<script src="js/engine.js"></script>
<script src="js/sprites.js"></script>
<script src="js/story.js"></script>
<script src="js/levels.js"></script>
<script src="js/entities.js"></script>
<script src="js/game.js"></script>
</body>
</html>
